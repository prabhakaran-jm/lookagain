<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LookAgain</title>
  <style>
    :root {
      --bg: #0f1419;
      --fg: #e7ecf1;
      --muted: #8b98a5;
      --accent: #3d9cf0;
      --warn: #f0b429;
      --ok: #3ecf8e;
      --panel: #1a222c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 20% -10%, #1c2a3a, var(--bg));
      color: var(--fg);
      min-height: 100vh;
    }
    .replay-banner {
      display: none;
      background: var(--warn);
      color: #1a1200;
      text-align: center;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 0.55rem;
    }
    .replay-banner.visible { display: block; }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 2rem 1.25rem 4rem;
    }
    h1 { font-size: 1.75rem; margin: 0 0 0.35rem; }
    p.lead { color: var(--muted); margin-top: 0; }
    .panel {
      background: var(--panel);
      border: 1px solid #2a3644;
      border-radius: 12px;
      padding: 1.25rem;
      margin-top: 1.25rem;
    }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.35rem; }
    select, button, input[type="file"] {
      width: 100%;
      margin-bottom: 0.9rem;
    }
    select, button {
      padding: 0.7rem 0.85rem;
      border-radius: 8px;
      border: 1px solid #3a4a5c;
      background: #121820;
      color: var(--fg);
    }
    button {
      background: var(--accent);
      border-color: transparent;
      color: #041018;
      font-weight: 650;
      cursor: pointer;
    }
    button.secondary {
      background: #243040;
      color: var(--fg);
      border: 1px solid #3a4a5c;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
      margin-bottom: 0.9rem;
    }
    .row button { margin-bottom: 0; }
    .status {
      font-size: 0.95rem;
      margin: 0 0 0.75rem;
      padding: 0.65rem 0.75rem;
      border-radius: 8px;
      background: #121820;
      border: 1px solid #2a3644;
    }
    .status.ok { border-color: var(--ok); color: var(--ok); }
    .status.warn { border-color: var(--warn); color: var(--warn); }
    .status.bad { border-color: #e85d5d; color: #e85d5d; }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.8rem;
      background: #0c1015;
      padding: 0.85rem;
      border-radius: 8px;
      border: 1px solid #243040;
      max-height: 420px;
      overflow: auto;
    }
    .hint { font-size: 0.8rem; color: var(--muted); margin: -0.4rem 0 0.8rem; }
  </style>
</head>
<body>
  <div id="replayBanner" class="replay-banner" role="status">REPLAY — recorded trace, not a live agent run</div>
  <main>
    <h1>LookAgain</h1>
    <p class="lead">Phone capture → triage → remediate → compare → bounded finalize.</p>

    <div class="panel">
      <label for="pack">Scenario pack</label>
      <select id="pack">
        <option value="appliance_leds">appliance_leds</option>
        <option value="bike_brake_pad">bike_brake_pad</option>
        <option value="leaf_spot">leaf_spot</option>
        <option value="breaker_panel">breaker_panel (should escalate)</option>
      </select>

      <label>No-prop demo pairs</label>
      <p class="hint">Runs shot1 then shot2 through the agent (glare→retake→finalize).</p>
      <div class="row">
        <button id="pairGlare" class="secondary" type="button">Glare → clean</button>
        <button id="pairCloser" class="secondary" type="button">Far → closer</button>
      </div>

      <label for="photo">Photo (phone camera or file)</label>
      <input id="photo" type="file" accept="image/*" capture="environment" />

      <button id="send" type="button">Run agent step</button>
      <div id="status" class="status">Waiting…</div>
      <pre id="out">Trace will appear here.</pre>
    </div>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    if (params.get("mode") === "replay") {
      document.getElementById("replayBanner").classList.add("visible");
    }
    const out = document.getElementById("out");
    const statusEl = document.getElementById("status");
    let sessionId = null;

    function setStatus(text, kind) {
      statusEl.textContent = text;
      statusEl.className = "status" + (kind ? " " + kind : "");
    }

    function summarize(j) {
      const next = j.next_action || "?";
      const tools = (j.agent && j.agent.tools_called) ? " [" + j.agent.tools_called.join(" → ") + "]" : "";
      const backend = (j.agent && j.agent.backend) ? " (" + j.agent.backend + ")" : "";
      if (next === "finalize_report") {
        return { text: "Finalize" + backend + tools + " — " + (j.claims || []).join(" | "), kind: "ok" };
      }
      if (next === "request_capture") {
        return {
          text: "Retake (" + (j.retake_reason || "?") + ") — " + j.retakes_remaining + " left" + backend + tools,
          kind: "warn",
        };
      }
      if (next === "escalate_human") {
        return { text: "Escalate — " + (j.reason || "HITL") + backend + tools, kind: "bad" };
      }
      return { text: next + backend + tools, kind: "" };
    }

    async function runPair(pairId) {
      const pack = document.getElementById("pack").value;
      setStatus("Running fixture pair " + pairId + "…", "");
      sessionId = null;
      const fd = new FormData();
      fd.append("pair_id", pairId);
      fd.append("pack_id", pack);
      const res = await fetch("/api/demo/run_pair", { method: "POST", body: fd });
      const json = await res.json();
      out.textContent = JSON.stringify(json, null, 2);
      if (!res.ok) {
        setStatus(json.error || "pair failed", "bad");
        return;
      }
      const s1 = summarize(json.step1 || {});
      const s2 = summarize(json.step2 || {});
      const ok = json.demo_ok ? "ok" : "warn";
      setStatus(
        "1) " + s1.text + "  →  2) " + s2.text + (json.demo_ok ? "  ✓ pair demo_ok" : ""),
        ok
      );
    }

    document.getElementById("pairGlare").onclick = () => runPair("leds_glare_retake");
    document.getElementById("pairCloser").onclick = () => runPair("leds_closer_retake");

    document.getElementById("send").onclick = async () => {
      const pack = document.getElementById("pack").value;
      const fileInput = document.getElementById("photo");
      if (!fileInput.files.length) {
        setStatus("Pick a photo first (or use a demo pair).", "warn");
        return;
      }
      setStatus("Running…", "");
      const fd = new FormData();
      fd.append("pack_id", pack);
      fd.append("file", fileInput.files[0]);
      if (sessionId) fd.append("session_id", sessionId);

      const res = await fetch("/api/upload", { method: "POST", body: fd });
      const json = await res.json();
      if (json.session_id) sessionId = json.session_id;
      if (json.allowed === false) sessionId = null;

      const s = summarize(json);
      setStatus(s.text, s.kind);
      out.textContent = JSON.stringify(json, null, 2);

      if (json.next_action === "finalize_report" || json.next_action === "escalate_human") {
        sessionId = null;
      }
    };
  </script>
</body>
</html>
